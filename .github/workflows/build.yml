name: Build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Build
      run: make build || go build -o bin/soundcloud-radio ./cmd/radio
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jiosaavn-radio
        path: bin/
